<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" rx="28" fill="#eef2ff" />
  <circle cx="100" cy="100" r="70" fill="#e0e7ff" />

  <!-- Shadow -->
  <ellipse cx="100" cy="172" rx="42" ry="8" fill="#c7d2fe" opacity="0.6" />

  <!-- Phone Body -->
  <rect x="68" y="32" width="64" height="134" rx="14" fill="url(#phoneGrad)" stroke="#4338ca" stroke-width="2.5" />
  
  <!-- Screen -->
  <rect x="74" y="44" width="52" height="110" rx="8" fill="url(#screenGrad)" />

  <!-- Speaker & Front Camera -->
  <rect x="91" y="38" width="18" height="3" rx="1.5" fill="#475569" />
  <circle cx="85" cy="39.5" r="1.5" fill="#64748b" />

  <!-- Screen Circuit Lines / Graphic -->
  <path d="M84,80 L100,66 L116,80 L100,94 Z" fill="#ffffff" opacity="0.3" />
  <circle cx="100" cy="104" r="14" fill="#ffffff" opacity="0.95" />
  <text x="100" y="109" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#4338ca" text-anchor="middle">⚡</text>

  <!-- Battery / Charging Bar -->
  <rect x="86" y="128" width="28" height="6" rx="3" fill="#ffffff" opacity="0.4" />
  <rect x="86" y="128" width="18" height="6" rx="3" fill="#ffffff" />
  
  <!-- Home Indicator Bar -->
  <rect x="88" y="159" width="24" height="3" rx="1.5" fill="#94a3b8" />
</svg>
