  <!-- Leaf Center Stem -->
  <path d="M32,20 Q32,38 24,46" stroke="url(#leafVein)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M31,30 Q36,32 38,36" stroke="url(#leafVein)" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M29,38 Q34,40 36,44" stroke="url(#leafVein)" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>
