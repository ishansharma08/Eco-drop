<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="40%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>
  <!-- Rounded Card Base -->
  <rect width="200" height="200" rx="28" fill="#f0f9ff" />
  <circle cx="100" cy="100" r="70" fill="#e0f2fe" />
  
  <!-- Bottle Shadow -->
  <ellipse cx="100" cy="172" rx="42" ry="8" fill="#bae6fd" opacity="0.6" />

  <!-- Bottle Body -->
  <!-- Cap -->
  <rect x="88" y="24" width="24" height="12" rx="3" fill="url(#capGrad)" />
  <rect x="84" y="34" width="32" height="6" rx="2" fill="#0284c7" />
  <!-- Neck -->
  <path d="M88,38 L88,52 L70,80 L70,154 Q70,166 84,166 L116,166 Q130,166 130,154 L130,80 L112,38 Z" fill="url(#bottleGrad)" />
  <!-- Liquid / Wave -->
  <path d="M72,110 Q85,115 100,110 T128,110 L128,154 Q128,164 116,164 L84,164 Q72,164 72,154 Z" fill="#0284c7" opacity="0.35" />
  <!-- Ribs / Indents -->
  <line x1="72" y1="92" x2="128" y2="92" stroke="#ffffff" stroke-width="2.5" opacity="0.7" stroke-linecap="round" />
  <line x1="72" y1="128" x2="128" y2="128" stroke="#ffffff" stroke-width="2.5" opacity="0.7" stroke-linecap="round" />
  <line x1="74" y1="142" x2="126" y2="142" stroke="#ffffff" stroke-width="2.5" opacity="0.7" stroke-linecap="round" />
  <!-- Highlight -->
  <path d="M78,82 L78,154" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <!-- Recycle Badge -->
  <circle cx="100" cy="110" r="16" fill="#ffffff" opacity="0.9" />
  <text x="100" y="115" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#0284c7" text-anchor="middle">♳</text>
</svg>
