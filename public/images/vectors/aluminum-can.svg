<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="canGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="25%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="canAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" rx="28" fill="#f8fafc" />
  <circle cx="100" cy="100" r="70" fill="#f1f5f9" />
  
  <!-- Shadow -->
  <ellipse cx="100" cy="170" rx="44" ry="9" fill="#cbd5e1" opacity="0.6" />

  <!-- Can Top Rim -->
  <ellipse cx="100" cy="46" rx="36" ry="12" fill="#cbd5e1" stroke="#64748b" stroke-width="2" />
  <ellipse cx="100" cy="45" rx="32" ry="9" fill="#e2e8f0" />
  <!-- Pull Tab -->
  <rect x="94" y="38" width="12" height="14" rx="3" fill="#64748b" />
  <circle cx="100" cy="42" r="3" fill="#cbd5e1" />

  <!-- Can Body -->
  <path d="M64,46 L64,152 Q64,166 100,166 Q136,166 136,152 L136,46" fill="url(#canGrad)" />
  <!-- Vibrant Graphic Band -->
  <path d="M64,74 L136,74 L136,132 L64,132 Z" fill="url(#canAccent)" />
  <path d="M64,88 Q100,105 136,88 L136,112 Q100,130 64,112 Z" fill="#ffffff" opacity="0.25" />
  
  <!-- Can Bottom Rim -->
  <ellipse cx="100" cy="154" rx="36" ry="10" fill="none" stroke="#64748b" stroke-width="2" />
  
  <!-- Vertical Highlight -->
  <line x1="96" y1="48" x2="96" y2="162" stroke="#ffffff" stroke-width="5" opacity="0.6" />
  <line x1="84" y1="52" x2="84" y2="158" stroke="#ffffff" stroke-width="2" opacity="0.4" />

  <!-- Recycle Symbol -->
  <circle cx="100" cy="103" r="15" fill="#ffffff" opacity="0.95" />
  <text x="100" y="108" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#ea580c" text-anchor="middle">♺</text>
</svg>
